# mypy configuration (run from the repo root: `mypy core server src client_gateway`).
#
# What this enforces (deep review C-09):
#   1. STRICT (every flag of `mypy --strict`) for the modules listed in the "strict" block: the modules
#      added by the 2026-10 deep-review work that were already clean. New code of that kind belongs there.
#   2. DEFAULT checking (untyped bodies unchecked, missing stubs ignored) for every module NOT listed in
#      the "legacy" block, so a new module cannot add errors.
#   3. LEGACY modules are listed with ignore_errors = True. Recorded baseline when the list was cut
#      (2026-10-03, mypy 2.3.1, default settings): 1,133 errors in 164 files. Fix a module, then delete its
#      section (the 'warn_unused_configs' flag does not catch a section that has become clean; re-run
#      `mypy` with the section removed to confirm).
# The old python/pyproject.toml [tool.mypy] section is not read from the repo root and claimed
# `disallow_untyped_defs` on core.*, which was never true; it is superseded by this file.
[mypy]
python_version = 3.10
mypy_path = .
namespace_packages = True
explicit_package_bases = True
ignore_missing_imports = True
follow_imports = silent
show_error_codes = True
warn_unused_configs = True
# mitmproxy (client_gateway.frontend, lazy imports) is typed for Python >= 3.12 syntax: do not parse it.
[mypy-mitmproxy.*]
follow_imports = skip
# ----------------------------------------------------------------------------- strict
[mypy-client_gateway.reminders]
check_untyped_defs = True
disallow_any_generics = True
disallow_incomplete_defs = True
disallow_subclassing_any = True
disallow_untyped_calls = True
disallow_untyped_decorators = True
disallow_untyped_defs = True
no_implicit_optional = True
warn_return_any = True
warn_unused_ignores = True
no_implicit_reexport = True
strict_equality = True
extra_checks = True

