; Root-level pytest config so pytest picks up our markers when invoked from
; the repo root. The primary configuration lives in python/pyproject.toml
; (used by CI / coverage); this file only mirrors the pieces pytest needs at
; collection time (markers) so the "Unknown pytest.mark.slow" warning
; disappears for everyday `pytest` invocations. Addopts / coverage / test
; discovery still come from python/pyproject.toml when running via `-c` or
; from inside the python/ directory.
[pytest]
minversion = 8.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    live_seam: test deliberately reaches a live seam (real Desktop connect/detect, bridge CLI subprocess, non-loopback socket); opts out of the conftest tripwire
    selftest: the per-app replay self-test of the masking gateway (tools/masking_lab/selftest.py)
